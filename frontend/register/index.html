<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Task Tracker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/styles.css?v=12"></head>
<body><div class="page-shell"><header class="site-header" id="site-header"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19.5 6.8"/></svg></span><span>Task<span class="brand-light">Tracker</span></span></a><nav class="header-actions"><span class="nav-note">Already registered?</span><a class="button button-ghost button-small" href="/login/">Login</a></nav></header>
<main class="auth-main"><section class="auth-card register-card"><a class="back-link" href="/">← Back to home</a><div class="auth-heading"><div class="auth-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm11-2v6m3-3h-6"/></svg></div><h1>Create your account</h1><p>Start organizing your day, one task at a time.</p></div>
<div class="form-alert" id="form-alert" role="alert" aria-live="polite" hidden></div>
<form id="register-form" method="post" action="/api/v1/auth/register" novalidate><div class="form-field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required><small class="field-error" data-error-for="name"></small></div><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><small class="field-error" data-error-for="email"></small></div><div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required><small class="field-error" data-error-for="password"></small></div><div class="form-field"><label for="password_confirmation">Confirm password</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" placeholder="Repeat your password" required><small class="field-error" data-error-for="password_confirmation"></small></div><button class="button button-primary button-full" type="submit"><span class="button-text">Create account</span><span class="button-spinner" aria-hidden="true"></span></button></form>
<p class="auth-switch">By creating an account, you agree to use Task Tracker responsibly.</p></section></main><footer class="site-footer"><span>© <span class="year"></span> Task Tracker</span><span>Project <a href="https://github.com/Nurlan270/task-tracker-go" target="_blank" rel="noopener noreferrer">Task Tracker</a></span></footer></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="/assets/js/config.js?v=12"></script><script src="/assets/js/api.js?v=12"></script><script src="/assets/js/common.js?v=12"></script><script src="/assets/js/auth.js?v=12"></script></body></html>
