server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /login { return 301 /login/; }
    location = /register { return 301 /register/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
