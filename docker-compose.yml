services:
  gateway:
    container_name: gateway
    build:
      target: dev
      context: .
      dockerfile: gateway/docker/app/Dockerfile
    volumes:
      - ./gateway:/app/gateway
      - ./common:/app/common
      - ./protos:/app/protos
    expose:
      - 8080
    networks:
      - task-tracker-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      task-service:
        condition: service_started
    restart: unless-stopped

  user-service:
    container_name: user-service
    build:
      target: dev
      context: .
      dockerfile: user-service/docker/app/Dockerfile
    volumes:
      - ./user-service:/app/user-service
      - ./common:/app/common
      - ./protos:/app/protos
    expose:
      - 7070
    networks:
      - task-tracker-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  task-service:
    container_name: task-service
    build:
      target: dev
      context: .
      dockerfile: task-service/docker/app/Dockerfile
    volumes:
      - ./task-service:/app/task-service
      - ./common:/app/common
      - ./protos:/app/protos
    expose:
      - 6060
    networks:
      - task-tracker-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/postgres/scripts/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task-tracker-network
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:8.4-alpine
    command: [
      "redis-server",
      "--requirepass", "$REDIS_PASSWORD",
      "--appendonly", "yes"
    ]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - task-tracker-network
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - task-tracker-network
    depends_on:
      gateway:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    expose:
      - 80
    networks:
      - task-tracker-network
    restart: unless-stopped

networks:
  task-tracker-network:

volumes:
  pg_data:
  redis_data:
