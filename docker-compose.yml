services:
  gateway:
    container_name: gateway
    build:
      target: dev
      context: .
      dockerfile: gateway/docker/app/Dockerfile
    volumes:
      - ./gateway:/app/gateway
      - ./common:/app/common
      - ./auth-service:/app/auth-service
      - ./protos:/app/protos
      - ./go.work:/app/go.work
    expose:
      - 8080
    networks:
      - task-tracker-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    container_name: auth-service
    build:
      target: dev
      context: .
      dockerfile: auth-service/docker/app/Dockerfile
    volumes:
      - ./auth-service:/app/auth-service
      - ./common:/app/common
      - ./gateway:/app/gateway
      - ./protos:/app/protos
      - ./go.work:/app/go.work
    expose:
      - 7070
    networks:
      - task-tracker-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/postgres/scripts/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    ports:
      - "5432:5432"
    env_file:
      - ./docker/postgres/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task-tracker-network
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - task-tracker-network
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

networks:
  task-tracker-network:

volumes:
  pg_data:
