syntax = "proto3";

package task.v1;

option go_package = "github.com/Nurlan270/task-tracker-go/protos/gen/proto/task/v1;task_v1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service TaskService {
  rpc Create(CreateRequest) returns (google.protobuf.Empty);
  rpc Update(UpdateRequest) returns (google.protobuf.Empty);
  rpc SoftDelete(SoftDeleteRequest) returns (google.protobuf.Empty);
  rpc BatchDelete(BatchDeleteRequest) returns (google.protobuf.Empty);
  rpc Restore(RestoreRequest) returns (google.protobuf.Empty);
  rpc ToggleCompletion(ToggleCompletionRequest) returns (google.protobuf.Empty);
  rpc List(ListRequest) returns (ListResponse);
}

//  Create new task
message CreateRequest {
  //  Task owner's id
  uint64 user_id = 1;

  //  Task's title
  string title = 2;

  //  Task's description
  string description = 3;
}

//  Update existing task
message UpdateRequest {
  //  Task's id
  uint64 task_id = 1;

  //  Task owner's id
  uint64 user_id = 2;

  //  New task title
  string title = 3;

  //  New task description
  string description = 4;
}

//  Soft delete task
message SoftDeleteRequest {
  //  Task's id
  uint64 task_id = 1;

  //  Task owner's id
  uint64 user_id = 2;
}

//  Restore task
message RestoreRequest {
  //  Task's id
  uint64 task_id = 1;

  //  Task owner's id
  uint64 user_id = 2;
}

//  Permanently delete tasks in batch
message BatchDeleteRequest {
  //  Tasks' ids
  repeated uint64 ids = 1;
}

enum TaskType {
  UNKNOWN = 0;
  UNCOMPLETED = 1;
  COMPLETED = 2;
  DELETED = 3;
}

//  Get list of all user's tasks
message ListRequest {
  //  Task's owner id
  uint64 user_id = 1;

  //  Task's type
  TaskType type = 2;
}

//  Task
message Task {
  //  Task's id
  uint64 id = 1;

  //  Task's title
  string title = 2;

  //  Task's description
  string description = 3;

  //  Task's creation time
  google.protobuf.Timestamp created_at = 4;

  //  Task's completion time
  google.protobuf.Timestamp completed_at = 5;
}

//  List of user's tasks
message ListResponse {
  //  List of tasks
  repeated Task task = 1;
}

//  Toggle task's completion time
message ToggleCompletionRequest {
  //  Task's id
  uint64 task_id = 1;

  //  Task owner's id
  uint64 user_id = 2;
}