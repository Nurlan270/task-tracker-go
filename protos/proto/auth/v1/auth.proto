syntax = "proto3";

package auth.v1;

option go_package = "github.com/Nurlan270/task-tracker-go/protos/gen/proto/auth/v1;auth_v1";

import "google/protobuf/empty.proto";

service AuthService {
  //  Register user and return access/refresh token pair
  rpc Register(RegisterRequest) returns (RegisterResponse);

  //  Login user and return access/refresh token pair
  rpc Login(LoginRequest) returns (LoginResponse);

  //  Logout user using its refresh token and return nothing
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);

  //  Refresh user's access/refresh token pair and return new ones
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

message RegisterRequest {
  //  user's name
  string name = 1;

  //  user's email address
  string email = 2;

  //  user's password
  string password = 3;
}

message RegisterResponse {
  //  user's access token
  string access_token = 1;

  //  user's refresh token
  string refresh_token = 2;

  //  access token's expiration in seconds
  int64 expires_in = 3;
}

message LoginRequest {
  //  user's email
  string email = 1;

  //  user's password
  string password = 2;
}

message LoginResponse {
  //  user's access token
  string access_token = 1;

  //  user's refresh token
  string refresh_token = 2;

  //  access token's expiration in seconds
  int64 expires_in = 3;
}

message LogoutRequest {
  //  user's refresh token
  string refresh_token = 1;
}

message RefreshRequest {
  //  user's old refresh token
  string refresh_token = 1;
}

message RefreshResponse {
  //  new access token
  string access_token = 1;

  //  new refresh token
  string refresh_token = 2;
}